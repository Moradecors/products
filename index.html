<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MORA - Heritage Handcrafted</title>
    
    <style>
        /* ================================================================
           1. COLORS & ROOT VARIABLES (LIGHT MODE)
        ================================================================= */
        :root {
          --bg: #FAF8F5;
          --bg-soft: #FFFFFF;
          --text: #1A1A1A;
          --text-soft: #444444;
          --text-mute: rgba(0,0,0,0.5);
          --accent: #00C853;
          --accent-soft: rgba(0, 200, 83, 0.1);
          --accent-2: #0040FF;
          --accent-2-soft: rgba(0, 64, 255, 0.1);
          --line: rgba(0,0,0,0.1);
          --line-soft: rgba(0,0,0,0.05);
          --ease-quiet: cubic-bezier(.22,1,.36,1);
          --ease-precise: cubic-bezier(.4,0,.2,1);
          --ease-emphasis: cubic-bezier(.16,1,.3,1);
        }

        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 300;
            line-height: 1.75;
            letter-spacing: 0.03em;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        h1, h2, h3, h4 { font-family: 'Plus Jakarta Sans', sans-serif; color: var(--text); font-weight: 500; line-height: 1.3; }
        a { text-decoration: none; color: inherit; }

        .eyebrow {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 600;
            font-size: 13px;
            color: var(--accent);
            display: inline-flex;
            align-items: center;
            gap: 0.85rem;
            margin-bottom: 1.5rem;
        }
        .eyebrow::after { display: none; }

        .add-to-order { 
            width: 100%; padding: 1.5rem; background: var(--accent); color: #ffffff; 
            font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 14px; cursor: pointer; 
            transition: background 400ms var(--ease-quiet), color 400ms var(--ease-quiet); 
            display: flex; align-items: center; justify-content: center; gap: 0.85rem; text-decoration: none; border: none;
        }
        .add-to-order:hover { background: var(--accent-2); color: #ffffff; }

        .featured-header-link, .contact-cta, .hero-btn {
            display: inline-flex; align-items: center; gap: 10px; background: transparent; border: none; color: var(--text);
            font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 13px; cursor: pointer; text-decoration: none;
            position: relative; padding-bottom: 10px; transition: color 400ms var(--ease-quiet);
        }
        .featured-header-link::after, .contact-cta::after, .hero-btn::after {
            content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 2px; background: var(--accent); transition: background 400ms var(--ease-quiet);
        }
        .featured-header-link:hover, .contact-cta:hover, .hero-btn:hover { color: var(--accent-2); }
        .featured-header-link:hover::after, .contact-cta:hover::after, .hero-btn:hover::after { background: var(--accent-2); }
        .featured-header-link svg, .contact-cta svg, .hero-btn svg { width: 16px; height: 16px; stroke: currentColor; }
        .hero-btn { color: #ffffff; }
        .hero-btn:hover { color: var(--accent); }

        .back-btn {
            display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px;
            border: 1px solid var(--accent-2); border-radius: 50%; margin-right: 1rem; background: var(--accent-2-soft);
            transition: border-color 400ms var(--ease-quiet), background 400ms var(--ease-quiet); text-decoration: none; cursor: pointer; flex-shrink: 0;
        }
        .back-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
        .back-btn svg { width: 16px; height: 16px; stroke: var(--text-soft); }

        header {
            display: flex; justify-content: space-between; align-items: center; padding: 24px 50px;
            background: rgba(250, 248, 245, 0.85); position: sticky; top: 0; z-index: 100; backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); gap: 20px;
        }
        
        .logo { cursor: pointer; flex-shrink: 0; display: flex; align-items: center; }
        .logo svg { height: 20px; width: auto; display: block; }

        #mainNav { flex-grow: 1; display: flex; justify-content: center; }
        #mainNav ul { display: flex; gap: 40px; list-style: none; }
        nav a, .filter-btn {
            background: transparent; border: none; font-size: 13px; font-weight: 500; color: var(--text-soft); 
            transition: color 300ms var(--ease-quiet); cursor: pointer; position: relative; padding-bottom: 5px; font-family: 'Plus Jakarta Sans', sans-serif;
        }
        nav a::after, .filter-btn::after { content: ''; position: absolute; bottom: 0; left: 0; width: 0; height: 1px; background: var(--accent-2); transition: width 300ms var(--ease-quiet); }
        nav a:hover, .filter-btn:hover { color: var(--accent-2); }
        nav a:hover::after, .filter-btn:hover::after { width: 100%; }
        nav a.active, .filter-btn.active { color: var(--accent-2); }
        nav a.active::after, .filter-btn.active::after { width: 100%; }

        .menu-toggle {
            display: none; background: transparent; border: none; cursor: pointer; padding: 5px;
            color: var(--text); flex-shrink: 0; align-items: center; justify-content: center;
        }
        
        .mobile-menu {
            position: fixed; top: 0; right: -280px; width: 280px; height: 100vh; background: var(--bg-soft);
            box-shadow: -2px 0 15px rgba(0,0,0,0.15); z-index: 1001; padding: 80px 30px 30px;
            display: flex; flex-direction: column; gap: 25px; transition: right 0.4s var(--ease-quiet);
        }
        .mobile-menu.is-open { right: 0; }
        .menu-close { position: absolute; top: 20px; right: 20px; background: transparent; border: none; cursor: pointer; padding: 5px; color: var(--text-soft); }
        
        .menu-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s var(--ease-quiet); }
        .menu-overlay.is-active { opacity: 1; pointer-events: auto; }
        
        .mobile-nav ul { list-style: none; display: flex; flex-direction: column; gap: 20px; }
        .mobile-nav a { font-size: 16px; font-weight: 500; color: var(--text); display: block; padding-bottom: 5px; border-bottom: 1px solid transparent; cursor: pointer; font-family: 'Plus Jakarta Sans', sans-serif; transition: color 0.3s ease; }
        .mobile-nav a:hover { color: var(--accent-2); border-bottom-color: var(--accent-2); }
        .mobile-contact-link { color: var(--accent) !important; font-weight: 600 !important; }

        #app { min-height: 80vh; }

        .hero { position: relative; height: 90vh; overflow: hidden; background: var(--bg-soft); }
        .hero-slider { position: relative; width: 100%; height: 100%; }
        .slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 1s var(--ease-quiet); pointer-events: none; }
        .slide.is-active { opacity: 1; pointer-events: auto; }
        .slide-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; }
        .slide-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to right, rgba(0,0,0,0.65), rgba(0,0,0,0.25)); z-index: 1; }
        .slide-content { position: relative; z-index: 2; max-width: 640px; padding: 0 50px; height: 100%; display: flex; flex-direction: column; justify-content: center; text-align: left; color: #ffffff; }
        .slide-eyebrow { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 0.25em; color: var(--accent); margin-bottom: 1.5rem; }
        .slide-title { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 3.5rem; font-weight: 400; line-height: 1.2; margin-bottom: 1.5rem; color: #ffffff; }
        .slide-title em { font-style: italic; font-weight: 300; }
        .slide-sub { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.1rem; font-weight: 300; line-height: 1.6; color: rgba(255,255,255,0.9); margin-bottom: 2.5rem; max-width: 500px; }

        .hero-controls { position: absolute; bottom: 40px; left: 0; width: 100%; padding: 0 50px; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .hero-counter { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; color: rgba(255,255,255,0.8); letter-spacing: 0.1em; }
        .hero-counter strong { color: #ffffff; font-weight: 600; }
        .hero-dots { display: flex; gap: 12px; }
        .hero-dot { width: 10px; height: 10px; background: rgba(255,255,255,0.3); border-radius: 50%; cursor: pointer; border: 1px solid transparent; transition: all 300ms var(--ease-quiet); padding: 0; }
        .hero-dot.is-active { background: #ffffff; border-color: #ffffff; transform: scale(1.1); }
        .hero-arrows { display: flex; gap: 15px; }
        .hero-arrow { width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.3); background: transparent; color: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 300ms var(--ease-quiet); }
        .hero-arrow:hover { background: rgba(255,255,255,0.1); border-color: #ffffff; }

        .section { padding: 120px 50px; }
        .section-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 60px; text-align: left; flex-wrap: wrap; gap: 20px; }
        .product-carousel-container { position: relative; max-width: 1400px; margin: 0 auto; }
        .product-carousel { display: flex; gap: 30px; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding-bottom: 20px; }
        .product-carousel::-webkit-scrollbar { display: none; }

        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; padding: 0 50px 120px; max-width: 1400px; margin: 0 auto; }

        .product-card {
            background: var(--bg-soft); border: 1px solid var(--line-soft); transition: border-color 400ms var(--ease-quiet), transform 400ms var(--ease-quiet), box-shadow 400ms var(--ease-quiet); cursor: pointer;
            display: flex; flex-direction: column; overflow: hidden; flex: 0 0 350px; scroll-snap-align: start;
        }
        .product-card.hidden { display: none; }
        .product-card:hover { transform: translateY(-5px); border-color: var(--accent); box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .product-card-img { width: 100%; height: 300px; background-size: cover; background-position: center; transition: opacity 400ms var(--ease-quiet); background-color: var(--bg); }
        .product-card:hover .product-card-img { opacity: 0.9; }

        .product-card-info { padding: 24px; text-align: left; display: flex; flex-direction: column; flex-grow: 1; }
        .product-category-tag { font-size: 12px; color: var(--text-mute); margin-bottom: 12px; display: block; font-weight: 500; }
        .product-card-info h3 { font-size: 1.2rem; margin-bottom: 8px; font-weight: 400; color: var(--text); }
        .price-container { margin-bottom: 10px; }
        .actual-price { color: var(--text-mute); text-decoration: line-through; margin-right: 12px; font-size: 0.9rem; }
        .discount-price { color: var(--accent); font-weight: 600; font-size: 1.3rem; }
        .material-info { font-size: 0.85rem; color: var(--text-mute); text-align: left; border-top: 1px solid var(--line-soft); padding-top: 16px; margin-top: auto; line-height: 1.6; font-weight: 300; }
        .material-info strong { color: var(--text-soft); font-weight: 500; }

        .history-section { background: var(--bg-soft); display: flex; align-items: center; gap: 80px; padding: 120px 50px; border-top: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft); }
        .history-image { flex: 1; height: 600px; background-image: url('https://z-cdn-media.chatglm.cn/files/9cb54507-2e2a-48e0-b537-be3e961f8a30.png?auth_key=1890252349-36e919e40ed3430fb4dd78033a27a99a-0-d67b0e2a25f45ac665afb6ea4284c576'); background-size: cover; background-position: center; filter: contrast(1.05); }
        .history-text { flex: 1; }
        .history-text h2 { font-size: 3rem; margin-bottom: 30px; color: var(--text); font-weight: 300; }
        .history-text p { margin-bottom: 25px; font-size: 1.05rem; line-height: 1.8; color: var(--text-soft); font-weight: 300; }

        .page-header { text-align: left; padding: 100px 50px 40px; background: var(--bg-soft); border-bottom: 1px solid var(--line-soft); }
        .page-header h1 { font-size: 2.5rem; margin-bottom: 15px; font-weight: 400; color: var(--text); }
        .page-header p { color: var(--text-soft); max-width: 600px; margin: 0; font-size: 1rem; font-weight: 300; }

        .filters { text-align: left; padding: 40px 50px; display: flex; justify-content: flex-start; gap: 40px; flex-wrap: wrap; background: var(--bg-soft); border-bottom: 1px solid var(--line-soft); }

        .pd-top-bar { display: flex; align-items: center; margin: 40px 50px 0; }
        .pd-back-text { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 500; font-size: 13px; color: var(--text-soft); transition: color 400ms var(--ease-quiet); cursor: pointer; }
        .pd-back-text:hover { color: var(--accent); }

        .product-detail-container { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; max-width: 1200px; margin: 0 auto; padding: 40px 50px 120px; }
        .pd-gallery { display: flex; flex-direction: column; gap: 20px; }
        .pd-main-image { width: 100%; height: 550px; background-size: cover; background-position: center; border: 1px solid var(--line); background-color: var(--bg-soft); }
        .pd-thumbnails { display: flex; gap: 15px; flex-wrap: wrap; }
        .pd-thumbnail { width: 100px; height: 100px; background-size: cover; background-position: center; cursor: pointer; border: 1px solid var(--line); transition: border-color 400ms var(--ease-quiet); background-color: var(--bg-soft); }
        .pd-thumbnail:hover { border-color: var(--accent-2); }
        .pd-thumbnail.active { border-color: var(--accent); }

        .pd-info h1 { font-size: 2.5rem; margin-bottom: 20px; font-weight: 400; }
        .pd-price-container { margin-bottom: 10px; display: flex; align-items: baseline; gap: 15px; }
        .pd-actual-price { font-size: 1.2rem; color: var(--text-mute); text-decoration: line-through; }
        .pd-discount-price { font-size: 2rem; color: var(--accent); font-weight: 600; }
        
        .pd-offer-badge { display: block; color: var(--text-mute); font-size: 14px; font-weight: 600; margin-bottom: 15px; font-family: 'Plus Jakarta Sans', sans-serif; }
        .pd-subtext { font-size: 0.9rem; color: var(--text-mute); margin-bottom: 40px; font-weight: 300; }
        
        .pd-details { margin-top: 60px; border-top: 1px solid var(--line); padding-top: 40px; }
        .pd-details h3 { font-size: 13px; margin-bottom: 30px; color: var(--text-soft); font-weight: 600; }
        .pd-spec-row { display: grid; grid-template-columns: 180px 1fr; margin-bottom: 20px; font-size: 14px; align-items: baseline; }
        .pd-spec-label { font-weight: 600; color: var(--text); font-size: 14px; }
        .pd-spec-value { color: var(--text-soft); font-weight: 300; font-size: 14px; }
        .pd-delivery-box { background: var(--bg); padding: 20px; border-left: 2px solid var(--accent); margin-top: 30px; font-size: 14px; color: var(--text-soft); font-weight: 300; }

        .terms-container { max-width: 800px; margin: 0 auto; padding: 80px 40px; }
        .terms-container h1 { font-size: 2.5rem; margin-bottom: 40px; text-align: left; color: var(--text); font-weight: 400; }
        .terms-section { margin-bottom: 40px; }
        .terms-section h2 { font-size: 1rem; margin-bottom: 12px; color: var(--text-soft); font-weight: 600; }
        .terms-section p { font-size: 0.95rem; color: var(--text-soft); font-weight: 300; line-height: 1.8; }

        footer { background: var(--bg-soft); color: var(--text-mute); padding: 80px 50px 40px; border-top: 1px solid var(--line-soft); }
        .footer-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; max-width: 1200px; margin: 0 auto; }
        .footer-col h4 { color: var(--text); margin-bottom: 24px; font-size: 13px; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; }
        .footer-col ul { list-style: none; }
        .footer-col ul li { margin-bottom: 12px; }
        .footer-col a { color: var(--text-mute); text-decoration: none; transition: color 400ms var(--ease-quiet); cursor: pointer; font-size: 0.9rem; font-weight: 300; }
        .footer-col a:hover { color: var(--accent); }
        .footer-bottom { text-align: left; margin-top: 60px; border-top: 1px solid var(--line-soft); padding-top: 30px; font-size: 0.85rem; color: var(--text-mute); font-weight: 300; }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 992px) {
            .history-section { flex-direction: column; gap: 40px; padding: 60px 20px; }
            .history-image { height: 400px; width: 100%; }
            .history-text h2 { font-size: 2.2rem; }
            .product-detail-container { grid-template-columns: 1fr; gap: 40px; padding: 20px 30px 80px; }
            .pd-main-image { height: 450px; }
        }
        @media (max-width: 768px) {
            header { padding: 15px 20px; gap: 10px; }
            .logo svg { height: 16px; }
            #mainNav { display: none; } 
            .contact-cta { display: none; }
            .menu-toggle { display: flex; }
            .slide-content { padding: 0 20px; }
            .slide-title { font-size: 2.2rem; }
            .slide-sub { font-size: 0.95rem; }
            .hero-controls { padding: 0 20px; bottom: 20px; }
            .section { padding: 80px 20px; }
            .product-card { flex: 0 0 280px; }
            .product-card-img { height: 250px; }
            .product-card-info { padding: 16px; }
            .product-card-info h3 { font-size: 1.1rem; margin-bottom: 6px; }
            .price-container { margin-bottom: 8px; }
            .actual-price { font-size: 0.8rem; margin-right: 8px; }
            .discount-price { font-size: 1.05rem; }
            .material-info { font-size: 0.8rem; padding-top: 12px; }
            .products-grid { grid-template-columns: 1fr 1fr; gap: 15px; padding: 0 20px 80px; }
            .page-header { padding: 80px 20px 30px; }
            .filters { gap: 20px; padding: 30px 20px; }
            .pd-spec-row { grid-template-columns: 120px 1fr; gap: 10px; }
            .footer-grid { grid-template-columns: 1fr; text-align: left; gap: 30px; }
        }
    </style>
</head>
<body>

        <div class="logo" onclick="window.navigate('home')">
            <svg width="684" height="159" viewBox="0 0 684 159" fill="none" xmlns="http://www.w3.org/2000/svg">

                <circle cx="282.002" cy="79.1127" r="79.0387" transform="rotate(-90 282.002 79.1127)" fill="#0040FF"/>
                <ellipse cx="282.001" cy="108.752" rx="49.3992" ry="49.3992" transform="rotate(-90 282.001 108.752)" fill="#39FF14"/>
            </svg>
        </div>

        <nav id="mainNav">
            <ul>
                <li><a onclick="window.navigate('home')">Home</a></li>
                <li><a onclick="window.navigate('products', {filter: 'all'})">All products</a></li>

        let heroCarouselInterval;

        window.navigate = function(view, params) {
            params = params || {};
            clearInterval(heroCarouselInterval);
            var currentState = history.state || { view: 'home' };
            history.replaceState(Object.assign({}, currentState, { scrollY: window.scrollY }), '', '');
            var newState = Object.assign({ view: view }, params);
            history.pushState(newState, '', '');
            renderView(newState);
            window.scrollTo(0, 0);
            updateActiveNav(newState);
        }

        window.addEventListener('popstate', function(e) {

        function initHeroCarousel() {
            var slides = document.querySelectorAll('#heroSlider .slide');
            var dots = document.querySelectorAll('#heroDots .hero-dot');
            var counter = document.getElementById('heroCurrent');
            var prevBtn = document.getElementById('heroPrev');
            var nextBtn = document.getElementById('heroNext');
            
            var current = 0;
            var total = slides.length;
            var slideInterval;

            function updateSlidePosition() {
                slides.forEach(function(slide, i) { slide.classList.toggle('is-active', i === current); });
                dots.forEach(function(dot, i) { dot.classList.toggle('is-active', i === current); });
                if (counter) { counter.textContent = String(current + 1).padStart(2, '0'); }
            }
            function nextSlide() { current = (current + 1) % total; updateSlidePosition(); }
            function prevSlide() { current = (current - 1 + total) % total; updateSlidePosition(); }
            function goToSlide(index) { current = index; updateSlidePosition(); resetInterval(); }
            function resetInterval() { clearInterval(slideInterval); slideInterval = setInterval(nextSlide, 5000); }

            if (nextBtn) nextBtn.addEventListener('click', function() { nextSlide(); resetInterval(); });
            if (prevBtn) prevBtn.addEventListener('click', function() { prevSlide(); resetInterval(); });
            if (dots.length > 0) { dots.forEach(function(dot, index) { dot.addEventListener('click', function() { goToSlide(index); }); }); }
            resetInterval();
        }
